<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SCROLL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: slideUp 0.4s ease-out;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Pulsante SCROLL in basso */
        .scroll-btn {
            position: absolute;
            bottom: 60px; /* come richiesto */
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 28px;
            border: none;
            border-radius: 12px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div id="videos"></div>

<script>
let allVideos = [];
let currentIndex = 0;
const CHUNK_SIZE = 20;

function loadNextChunk() {
    const container = document.getElementById("videos");

    const slice = allVideos.slice(currentIndex, currentIndex + CHUNK_SIZE);

    slice.forEach((vid, i) => {
        const div = document.createElement("div");
        div.className = "video-box";

        div.innerHTML = `
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/${vid.id}"
                frameborder="0"
                allowfullscreen
            ></iframe>
        `;

        container.appendChild(div);

        // PRELOAD del prossimo video
        if (i < slice.length - 1) {
            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "document";
            preload.href = `https://www.youtube.com/embed/${slice[i+1].id}`;
            document.head.appendChild(preload);
        }
    });

    currentIndex += CHUNK_SIZE;
}

async function init() {
    const res = await fetch("/api/links");
    allVideos = await res.json();

    loadNextChunk();
}

window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY + window.innerHeight;
    const pageHeight = document.body.scrollHeight;

    if (scrollPos > pageHeight - 800) {
        if (currentIndex < allVideos.length) {
            loadNextChunk();
        }
    }
});

init();
</script>


</body>
</html>
