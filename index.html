<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SCROLL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            width: 100vw;
            height: 100vh;

            /*  Scroll stile TikTok */
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;

            /* ⭐ Ogni video è un punto di snap */
            scroll-snap-align: start;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: slideUp 0.4s ease-out;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        .scroll-btn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 28px;
            border: none;
            border-radius: 12px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            cursor: pointer;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div id="videos"></div>

<script>
let allVideos = [];
let currentIndex = 0;
const CHUNK_SIZE = 20;

// Mescola array (Fisher-Yates)
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function loadNextChunk() {
    const container = document.getElementById("videos");
    const slice = allVideos.slice(currentIndex, currentIndex + CHUNK_SIZE);

    slice.forEach((vid, i) => {
        const div = document.createElement("div");
        div.className = "video-container";

        div.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${vid.id}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&enablejsapi=1"
                allow="autoplay"
                allowfullscreen
            ></iframe>

            <button class="scroll-btn">SCROLL</button>
        `;

        container.appendChild(div);

        //  Preload del prossimo video
        if (i < slice.length - 1) {
            const preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "document";
            preload.href = `https://www.youtube-nocookie.com/embed/${slice[i+1].id}`;
            document.head.appendChild(preload);
        }

        //  Pulsante SCROLL → snap al prossimo video
        div.querySelector(".scroll-btn").onclick = () => {
            window.scrollBy({
                top: window.innerHeight,
                behavior: "smooth"
            });
        };
    });

    currentIndex += CHUNK_SIZE;
}

async function init() {
    const res = await fetch("/api/links");
    allVideos = await res.json();

    shuffle(allVideos); // RANDOM

    loadNextChunk();
}

//  Lazy loading infinito
window.addEventListener("scroll", () => {
    const scrollPos = window.scrollY + window.innerHeight;
    const pageHeight = document.body.scrollHeight;

    if (scrollPos > pageHeight - 800) {
        if (currentIndex < allVideos.length) {
            loadNextChunk();
        }
    }
});

init();
</script>

</body>
</html>
