<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ScrollCoC Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .section {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .section h2 {
            margin-top: 0;
            font-size: 20px;
        }

        #countNumber {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        #updateLog {
            width: 100%;
            height: 150px;
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 10px;
            overflow-y: scroll;
            white-space: pre-wrap;
            font-family: monospace;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 14px;
        }

        th {
            background: #eee;
        }

        button {
            padding: 10px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 10px;
        }

        button:hover {
            background: #005fcc;
        }
    </style>
</head>

<body>

    <h1>ScrollCoC Admin</h1>

    <!-- COUNT SECTION -->
    <div class="section">
        <h2>Conteggio totale</h2>
        <div id="countNumber">–</div>
    </div>

    <!-- DATABASE SECTION -->
    <div class="section">
        <h2>Database</h2>
        <button id="copyBtn">Copia database</button>

        <table id="dbTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Video ID</th>
                </tr>
            </thead>
            <tbody id="dbTableBody">
                <!-- preview dei primi 7 -->
            </tbody>
        </table>

        <button id="expandBtn" style="margin-top:10px;">Mostra tutti i video</button>
    </div>

    <!-- UPDATE SECTION -->
    <div class="section">
        <h2>Aggiorna database</h2>
        <button id="updateBtn">Aggiorna ora</button>
        <div id="updateLog"></div>
    </div>

<script>
    async function updateCount() {
        try {
            const res = await fetch("/api/links");
            const data = await res.json();
            document.getElementById("countNumber").textContent = data.length;
        } catch (err) {
            document.getElementById("countNumber").textContent = "Errore";
        }
    }

    async function loadDatabase() {
        try {
            const res = await fetch("/api/links");
            const data = await res.json();

            const tbody = document.getElementById("dbTableBody");
            tbody.innerHTML = "";

            // Mostra solo i primi 7
            const preview = data.slice(0, 7);

            preview.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.id}</td>
                `;
                tbody.appendChild(tr);
            });

            // Pulsante "Mostra tutti"
            const expandBtn = document.getElementById("expandBtn");
            expandBtn.onclick = () => {
                tbody.innerHTML = "";
                data.forEach((item, index) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.id}</td>
                    `;
                    tbody.appendChild(tr);
                });
                expandBtn.disabled = true;
                expandBtn.textContent = "Tabella completa mostrata";
            };

        } catch (err) {
            const tbody = document.getElementById("dbTableBody");
            tbody.innerHTML = "<tr><td colspan='2'>Errore nel caricamento.</td></tr>";
        }
    }

    async function copyDatabase() {
        try {
            const res = await fetch("/api/links");
            const data = await res.json();
            const text = JSON.stringify(data, null, 2);

            await navigator.clipboard.writeText(text);
            alert("Database copiato negli appunti!");
        } catch (err) {
            alert("Errore nella copia del database.");
            console.error(err);
        }
    }

    async function updateDatabase() {
        const log = document.getElementById("updateLog");
        log.textContent = "";

        // STREAMING LOG IN DIRETTA
        const evtSource = new EventSource("/stream_update");

        evtSource.onmessage = function(event) {
            log.textContent += event.data + "\n";
            log.scrollTop = log.scrollHeight;
        };

        // AVVIA L'UPDATE
        await fetch("/t1m2s7/update_database", { method: "POST" });
    }

    // Aggiornamento automatico del count
    setInterval(updateCount, 3000);

    // Caricamento iniziale
    updateCount();
    loadDatabase();

    // Pulsanti
    document.getElementById("updateBtn").onclick = updateDatabase;
    document.getElementById("copyBtn").onclick = copyDatabase;
</script>

</body>
</html>
